{% set h = inventory.parameters.helmfile -%}
# Generated by Kapitan for environment: {{ h.environment }}
# Do not edit by hand; change the inventory and recompile.
repositories:
{% for repo in h.repositories %}
  - name: {{ repo.name }}
    url: {{ repo.url }}
{% endfor %}
releases:
  - name: {{ h.release.name }}
    namespace: {{ h.release.namespace }}
    chart: {{ h.release.chart }}
    version: {{ h.release.version }}
    values:
      - values.yaml
